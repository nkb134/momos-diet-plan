name: Deploy bot

on:
  push:
    branches: [main]
    paths: ['bot/**', 'scripts/lib/days.mjs', '.github/workflows/bot-deploy.yml']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_CF: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - name: Skip until Cloudflare secrets exist
        if: env.HAS_CF != 'true'
        run: echo "CLOUDFLARE_API_TOKEN is not set; nothing to deploy yet."
      - uses: actions/checkout@v7
        if: env.HAS_CF == 'true'
      - uses: actions/setup-node@v6
        if: env.HAS_CF == 'true'
        with: { node-version: 22 }
      - run: npm ci --prefix bot
        if: env.HAS_CF == 'true'
      - name: Deploy Worker with secrets
        if: env.HAS_CF == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: bot
          command: deploy
          secrets: |
            TELEGRAM_BOT_TOKEN
            TELEGRAM_WEBHOOK_SECRET
            GITHUB_TOKEN
            ALLOWED_USER_ID
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          GITHUB_TOKEN: ${{ secrets.BOT_GITHUB_TOKEN }}
          ALLOWED_USER_ID: ${{ secrets.TELEGRAM_ALLOWED_USER_ID }}
